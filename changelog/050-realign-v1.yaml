# v1.0.0 realignment -- the contract adopts the shape its consumer actually reads.
#
# The v0.1.0 tables were written before repo 4 existed and disagreed with it on
# nearly every table: metadata columns had different names (_batch_id vs
# _ingest_batch_id, _schema_version vs _envelope_version), bronze was missing the
# provenance columns the landing envelope now carries, silver.financial_fact was
# missing `decimals` (which is what makes rounding-only restatements detectable),
# and quarantine used a per-table mirror instead of one generic record_json shape.
#
# Auto Loader routes unknown fields into _rescued_data rather than failing, so the
# mismatch would have produced silently NULL columns, not an error.
#
# Drop-and-recreate rather than ALTER: every table was verified empty (0 rows
# across all 13) before this changeset was written, and Delta RENAME COLUMN needs
# column-mapping mode enabled. Rollback drops the new table; the v0.1.0 shape is
# recoverable by checking out tag v0.1.0 and running its changelog.
databaseChangeLog:

  - changeSet:
      id: 050-realign-bronze-filing_index_raw
      author: dark417
      comment: >-
        Replace bronze.filing_index_raw with the consumer-verified v1.0.0 shape.
      changes:
        - dropTable:
            catalogName: edgar
            schemaName: bronze
            tableName: filing_index_raw
        - createTable:
            catalogName: edgar
            schemaName: bronze
            tableName: filing_index_raw
            columns:
              - column: {name: logical_date, type: DATE, constraints: {nullable: false}}
              - column: {name: resource_id, type: STRING}
              - column: {name: fetched_at, type: TIMESTAMP}
              - column: {name: form_type, type: STRING}
              - column: {name: company_name, type: STRING}
              - column: {name: cik, type: STRING}
              - column: {name: date_filed, type: STRING}
              - column: {name: accession_number, type: STRING}
              - column: {name: file_name, type: STRING}
              - column: {name: _ingest_batch_id, type: STRING, constraints: {nullable: false}}
              - column: {name: _ingest_ts, type: TIMESTAMP, constraints: {nullable: false}}
              - column: {name: _source_file, type: STRING, constraints: {nullable: false}}
              - column: {name: _source_system, type: STRING, constraints: {nullable: false}}
              - column: {name: _envelope_version, type: STRING, constraints: {nullable: false}}
              - column: {name: _rescued_data, type: STRING}
      rollback:
        - dropTable: {catalogName: edgar, schemaName: bronze, tableName: filing_index_raw}


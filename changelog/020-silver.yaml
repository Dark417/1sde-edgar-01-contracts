# Silver: typed, MERGEd tables (data contracts §3). cik is STRING everywhere —
# leading zeros are semantically meaningful in EDGAR URLs; never an int.
databaseChangeLog:
  - changeSet:
      id: 020-silver-filing-create
      author: dark417
      changes:
        - createTable:
            catalogName: edgar
            schemaName: silver
            tableName: filing
            columns:
              - column: {name: accession_number, type: STRING, constraints: {nullable: false}}
              - column: {name: cik, type: STRING, constraints: {nullable: false}}
              - column: {name: company_name, type: STRING}
              - column: {name: form_type, type: STRING, constraints: {nullable: false}}
              - column: {name: base_form_type, type: STRING, constraints: {nullable: false}}
              - column: {name: is_amendment, type: BOOLEAN, constraints: {nullable: false}}
              - column: {name: filed_date, type: DATE, constraints: {nullable: false}}
              - column: {name: source_file_name, type: STRING}
              - column: {name: _first_seen_ts, type: TIMESTAMP, constraints: {nullable: false}}
              - column: {name: _last_seen_ts, type: TIMESTAMP, constraints: {nullable: false}}
              - column: {name: _batch_id, type: STRING, constraints: {nullable: false}}
      rollback:
        - dropTable: {catalogName: edgar, schemaName: silver, tableName: filing}

  - changeSet:
      id: 020-silver-company-create
      author: dark417
      changes:
        - createTable:
            catalogName: edgar
            schemaName: silver
            tableName: company
            columns:
              - column: {name: cik, type: STRING, constraints: {nullable: false}}
              - column: {name: name, type: STRING, constraints: {nullable: false}}
              - column: {name: sic, type: STRING}
              - column: {name: sic_description, type: STRING}
              - column: {name: state_of_incorporation, type: STRING}
              - column: {name: fiscal_year_end, type: STRING}
              - column: {name: tickers, type: ARRAY<STRING>}
              - column: {name: exchanges, type: ARRAY<STRING>}
              - column: {name: _hash_diff, type: STRING, constraints: {nullable: false}}
              - column: {name: valid_from, type: DATE, constraints: {nullable: false}}
              - column: {name: valid_to, type: DATE}
              - column: {name: is_current, type: BOOLEAN, constraints: {nullable: false}}
              - column: {name: _first_seen_ts, type: TIMESTAMP, constraints: {nullable: false}}
              - column: {name: _last_seen_ts, type: TIMESTAMP, constraints: {nullable: false}}
              - column: {name: _batch_id, type: STRING, constraints: {nullable: false}}
      rollback:
        - dropTable: {catalogName: edgar, schemaName: silver, tableName: company}

  - changeSet:
      id: 020-silver-financial-fact-create
      author: dark417
      changes:
        - createTable:
            catalogName: edgar
            schemaName: silver
            tableName: financial_fact
            columns:
              - column: {name: cik, type: STRING, constraints: {nullable: false}}
              - column: {name: taxonomy, type: STRING, constraints: {nullable: false}}
              - column: {name: concept, type: STRING, constraints: {nullable: false}}
              - column: {name: concept_canonical, type: STRING}
              - column: {name: unit, type: STRING, constraints: {nullable: false}}
              - column: {name: value, type: "DECIMAL(38,6)", constraints: {nullable: false}}
              - column: {name: period_start, type: DATE}
              - column: {name: period_end, type: DATE, constraints: {nullable: false}}
              - column: {name: period_type, type: STRING, constraints: {nullable: false}}
              - column: {name: fy, type: STRING}
              - column: {name: fp, type: STRING}
              - column: {name: form, type: STRING}
              - column: {name: accession_number, type: STRING, constraints: {nullable: false}}
              - column: {name: filed_date, type: DATE, constraints: {nullable: false}}
              - column: {name: _first_seen_ts, type: TIMESTAMP, constraints: {nullable: false}}
              - column: {name: _last_seen_ts, type: TIMESTAMP, constraints: {nullable: false}}
              - column: {name: _batch_id, type: STRING, constraints: {nullable: false}}
      rollback:
        - dropTable: {catalogName: edgar, schemaName: silver, tableName: financial_fact}

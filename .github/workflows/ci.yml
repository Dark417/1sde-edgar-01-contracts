name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  # us-east-2 is not a preference, it is where the Unity Catalog metastore lives.
  # Verified live: `databricks metastores get` returns region us-east-2 and
  # global_metastore_id aws:us-east-2:<METASTORE_ID>. A
  # workspace can only attach to the metastore in its own region, so every bucket
  # this project touches belongs here too -- anywhere else is cross-region egress
  # on every single read. Do not "fix" this to another region.
  AWS_REGION: us-east-2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (Tier-1/Tier-2 leak gate, root AGENTS.md)
        run: bash scripts/secret-scan.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Types
        run: mypy --strict src/

      - name: Unit tests (no spark) + coverage gate
        run: pytest -m "not spark" --cov --cov-fail-under=90

      - name: Spark tests
        run: pytest -m spark

      - name: Grep gate — no createIndex in changelogs
        run: |
          if grep -rn "createIndex" changelog/; then
            echo "createIndex is unsupported by the Databricks extension; use changeClusterColumns" >&2
            exit 1
          fi

      - name: Liquibase validate (offline, no JDBC connection)
        uses: liquibase-github-actions/validate@v4.32.0
        with:
          changelogFile: changelog/db.changelog-root.yaml
          url: "offline:databricks"

  # One environment: the tag IS the release button. DDL applies before the wheel
  # publishes so no consumer can ever install a version whose tables don't exist.
  # `update` is idempotent (append-only changesets; re-run = no-op) and the
  # concurrency group serializes overlapping tag pushes.
  apply-ddl:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    concurrency: liquibase-apply
    steps:
      - uses: actions/checkout@v4

      # The liquibase-github-actions image ships the Databricks extension but NOT
      # the Simba JDBC driver, so it cannot resolve jdbc:databricks:// URLs. Install
      # the CLI plus both jars directly instead (same recipe as tools/ locally).
      - name: Install Liquibase + Databricks extension + JDBC driver
        run: |
          curl -sL -o /tmp/liquibase.tar.gz https://github.com/liquibase/liquibase/releases/download/v5.0.3/liquibase-5.0.3.tar.gz
          mkdir -p /tmp/liquibase && tar -xzf /tmp/liquibase.tar.gz -C /tmp/liquibase
          curl -sL -o /tmp/liquibase/internal/lib/liquibase-databricks.jar \
            https://github.com/liquibase/liquibase-databricks/releases/download/v5.0.3/liquibase-databricks-5.0.3.jar
          curl -sL -o /tmp/jdbc.zip \
            "https://databricks-bi-artifacts.s3.us-east-2.amazonaws.com/simbaspark-drivers/jdbc/2.7.3/DatabricksJDBC42-2.7.3.1010.zip"
          unzip -q /tmp/jdbc.zip -d /tmp/jdbc
          cp /tmp/jdbc/*/DatabricksJDBC42.jar /tmp/liquibase/internal/lib/

      - name: Liquibase update against the workspace
        env:
          LIQUIBASE_COMMAND_URL: "jdbc:databricks://${{ secrets.DBX_HOST }}:443/default;transportMode=http;ssl=1;httpPath=${{ secrets.DBX_HTTP_PATH }};ConnCatalog=edgar;ConnSchema=default"
          LIQUIBASE_COMMAND_USERNAME: token
          LIQUIBASE_COMMAND_PASSWORD: ${{ secrets.DBX_PAT }}
          LIQUIBASE_COMMAND_DRIVER: com.databricks.client.jdbc.Driver
        run: |
          /tmp/liquibase/liquibase --changelog-file=changelog/db.changelog-root.yaml update

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apply-ddl
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          pip install build
          python -m build

      # The release below IS the distribution channel. There was an `aws s3 cp` here
      # that pushed the wheel to "s3://$TF_BUCKET/wheels/" -- the Terraform *state*
      # bucket, which is not a package index and which no consumer ever read. Repo 3
      # reads the release asset; repo 4 uses its own in-repo mirror. Removed rather
      # than retargeted: one publishing channel, not two that can disagree.
      - name: GitHub release with wheel attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.whl --generate-notes

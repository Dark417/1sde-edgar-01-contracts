name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  # us-east-2 is not a preference, it is where the Unity Catalog metastore lives.
  # Verified live: `databricks metastores get` returns region us-east-2 and
  # global_metastore_id aws:us-east-2:083f6670-cb9a-4058-9fd5-ed2fd09b1f15. A
  # workspace can only attach to the metastore in its own region, so every bucket
  # this project touches belongs here too -- anywhere else is cross-region egress
  # on every single read. Do not "fix" this to another region.
  AWS_REGION: us-east-2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Types
        run: mypy --strict src/

      - name: Unit tests (no spark) + coverage gate
        run: pytest -m "not spark" --cov --cov-fail-under=90

      - name: Spark tests
        run: pytest -m spark

      - name: Grep gate — no createIndex in changelogs
        run: |
          if grep -rn "createIndex" changelog/; then
            echo "createIndex is unsupported by the Databricks extension; use changeClusterColumns" >&2
            exit 1
          fi

      - name: Liquibase validate (offline, no JDBC connection)
        uses: liquibase-github-actions/validate@v4.32.0
        with:
          changelogFile: changelog/db.changelog-root.yaml
          url: "offline:databricks"

  # One environment: the tag IS the release button. DDL applies before the wheel
  # publishes so no consumer can ever install a version whose tables don't exist.
  # `update` is idempotent (append-only changesets; re-run = no-op) and the
  # concurrency group serializes overlapping tag pushes.
  apply-ddl:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    concurrency: liquibase-apply
    steps:
      - uses: actions/checkout@v4

      - name: Liquibase update against the workspace
        uses: liquibase-github-actions/update@v4.32.0
        with:
          changelogFile: changelog/db.changelog-root.yaml
          url: "jdbc:databricks://${{ secrets.DBX_HOST }}:443/default;transportMode=http;ssl=1;httpPath=${{ secrets.DBX_HTTP_PATH }};ConnCatalog=edgar;ConnSchema=default"
          username: token
          password: ${{ secrets.DBX_PAT }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apply-ddl
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          pip install build
          python -m build

      # The release below IS the distribution channel. There was an `aws s3 cp` here
      # that pushed the wheel to "s3://$TF_BUCKET/wheels/" -- the Terraform *state*
      # bucket, which is not a package index and which no consumer ever read. Repo 3
      # reads the release asset; repo 4 uses its own in-repo mirror. Removed rather
      # than retargeted: one publishing channel, not two that can disagree.
      - name: GitHub release with wheel attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.whl --generate-notes

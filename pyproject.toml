[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edgar-lakehouse-contracts"
version = "1.2.0"
description = "Shared contract layer for the edgar lakehouse: table schemas, name and path builders, landing envelope, and the DQ rule registry"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Dark417" }]
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pyspark>=3.5",
    "delta-spark>=3.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyyaml>=6.0",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_lakehouse_contracts"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["edgar_lakehouse_contracts"]

[[tool.mypy.overrides]]
module = "pyspark.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spark: tests that build a SparkSession (slow; run separately)",
]
addopts = "-q"

[tool.coverage.run]
source = ["src/edgar_lakehouse_contracts"]
omit = ["src/edgar_lakehouse_contracts/spark/*"]

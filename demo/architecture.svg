<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">SEC EDGAR lakehouse — where the contracts repo sits</text>
  <text x="500" y="56" text-anchor="middle" font-size="14" fill="#6b7280">Six repositories, one direction of dependency</text>

  <!-- pipeline row -->
  <g>
    <rect x="24" y="86" width="150" height="66" rx="8" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="2"/>
    <text x="99" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1 · contracts</text>
    <text x="99" y="132" text-anchor="middle" font-size="12" fill="#dbeafe">schema + rules</text>

    <rect x="204" y="86" width="140" height="66" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="274" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">2 · infra</text>
    <text x="274" y="132" text-anchor="middle" font-size="12" fill="#4b5563">AWS + workspace</text>

    <rect x="374" y="86" width="140" height="66" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="444" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">3 · ingest</text>
    <text x="444" y="132" text-anchor="middle" font-size="12" fill="#4b5563">EDGAR → S3</text>

    <rect x="544" y="86" width="140" height="66" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="614" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">4 · pipelines</text>
    <text x="614" y="132" text-anchor="middle" font-size="12" fill="#4b5563">bronze→silver→gold</text>

    <rect x="714" y="86" width="130" height="66" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="779" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">5 · serving</text>
    <text x="779" y="132" text-anchor="middle" font-size="12" fill="#4b5563">API + UI</text>

    <rect x="874" y="86" width="102" height="66" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="925" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">6 · chatbot</text>
    <text x="925" y="132" text-anchor="middle" font-size="12" fill="#4b5563">planned</text>

    <g stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M174 119 H200"/>
      <path d="M344 119 H370"/>
      <path d="M514 119 H540"/>
      <path d="M684 119 H710"/>
      <path d="M844 119 H870"/>
    </g>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <line x1="24" y1="186" x2="976" y2="186" stroke="#e5e7eb" stroke-width="2"/>
  <text x="24" y="214" font-size="16" font-weight="600" fill="#111827">Inside repo 1: one schema, written down twice — on purpose</text>

  <!-- two representations -->
  <rect x="24" y="236" width="250" height="96" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="149" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Liquibase changelogs</text>
  <text x="149" y="284" text-anchor="middle" font-size="12" fill="#1f2937">the migrations that</text>
  <text x="149" y="302" text-anchor="middle" font-size="12" fill="#1f2937">CREATE the tables</text>
  <text x="149" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">43 applied</text>

  <rect x="24" y="352" width="250" height="96" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="149" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Python / Spark schemas</text>
  <text x="149" y="400" text-anchor="middle" font-size="12" fill="#1f2937">what the other repos'</text>
  <text x="149" y="418" text-anchor="middle" font-size="12" fill="#1f2937">code compiles against</text>
  <text x="149" y="438" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">13 tables · 199 columns</text>

  <!-- drift test -->
  <path d="M274 284 H340" stroke="#b91c1c" stroke-width="2.5" fill="none" marker-end="url(#arrowRed)"/>
  <path d="M274 400 H340" stroke="#b91c1c" stroke-width="2.5" fill="none" marker-end="url(#arrowRed)"/>

  <rect x="346" y="288" width="212" height="108" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="452" y="316" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">Drift test</text>
  <text x="452" y="338" text-anchor="middle" font-size="12" fill="#1f2937">compares the two on</text>
  <text x="452" y="356" text-anchor="middle" font-size="12" fill="#1f2937">every commit and fails</text>
  <text x="452" y="374" text-anchor="middle" font-size="12" fill="#1f2937">naming the exact column</text>

  <text x="452" y="424" text-anchor="middle" font-size="12" font-style="italic" fill="#6b7280">the reason this repo exists</text>

  <!-- release -->
  <path d="M558 342 H624" stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="591" y="332" text-anchor="middle" font-size="11" fill="#4b5563">git tag</text>

  <rect x="630" y="236" width="346" height="212" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="803" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">One tag ships both, in order</text>

  <rect x="654" y="280" width="298" height="48" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="672" y="300" font-size="12" font-weight="600" fill="#1e3a8a">1. migrations run against the warehouse</text>
  <text x="672" y="318" font-size="11" fill="#4b5563">tables exist before anyone can install the code</text>

  <path d="M803 328 V344" stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>

  <rect x="654" y="348" width="298" height="48" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="672" y="368" font-size="12" font-weight="600" fill="#1e3a8a">2. Python package published</text>
  <text x="672" y="386" font-size="11" fill="#4b5563">repos 3–6 install one exact version, never "latest"</text>

  <text x="803" y="424" text-anchor="middle" font-size="12" fill="#6b7280">a consumer can never install a version</text>
  <text x="803" y="440" text-anchor="middle" font-size="12" fill="#6b7280">whose tables do not exist yet</text>

  <text x="24" y="484" font-size="12" fill="#6b7280">Portfolio project on Databricks Free Edition — not licensed for commercial use.</text>
  <text x="24" y="504" font-size="12" fill="#6b7280">github.com/Dark417 · repo 1 of 6</text>
</svg>
